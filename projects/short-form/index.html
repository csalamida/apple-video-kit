<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Short-form Reel</title>
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
    <link rel="stylesheet" href="components/tokens.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="components/glass-components.js"></script>
    <script src="components/camera.js"></script>
    <script src="components/canvas.js"></script>
    <script src="inputs/face-track.vertical.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0f; font-family: var(--font-ui); color: #fff; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .subcomp-host { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; }
      #footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 5; }
    </style>
  </head>
  <body>
    <!--
      Short-form reel, 1080x1920 (9:16). Edit the host tags below; `npm run short:check` verifies them.
      Rules this page follows (see .agents/skills/apple-video-editor/references/short-form.md):
        - everything sits inside the platform safe zones: top 230, bottom 430, right 150 (components/canvas.js)
        - captions: each cue holds readable for at least 0.5 s after it has entered
        - cards stay off the face (the head box in inputs/face-track.vertical.js)
      z-order: footage 5 < lower-third 55 < metric 56 < link 57 < captions 75 < transition 90
    -->
    <div id="root" class="clip" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="21.92">
      <video id="footage" class="clip" src="inputs/_demo/speaker-vertical.mp4" data-start="0" data-duration="21.92" data-media-start="0" data-has-audio="true" playsinline></video>

      <div id="lower-host" class="clip subcomp-host" style="z-index: 55;" data-composition-id="lower-third-0" data-composition-src="compositions/tpl/lower-third.html" data-start="1" data-duration="3.4" data-variable-values='{"at": 1, "dur": 3.4, "side": "left", "top": 290, "scale": 1.7}'></div>
      <div id="metric-host" class="clip subcomp-host" style="z-index: 56;" data-composition-id="metric-counter-0" data-composition-src="compositions/tpl/metric-counter.html" data-start="5.2" data-duration="4" data-variable-values='{"at": 5.2, "dur": 4, "side": "right", "top": 272, "scale": 0.9, "label": "Watch time", "sub": "after captions", "to": 42, "suffix": "%"}'></div>
      <div id="link-host" class="clip subcomp-host" style="z-index: 57;" data-composition-id="link-chip-0" data-composition-src="compositions/tpl/link-chip.html" data-start="15.4" data-duration="4" data-variable-values='{"at": 15.4, "dur": 4, "side": "center", "top": 1110, "scale": 1.6}'></div>
      <div id="progress-host" class="clip subcomp-host" style="z-index: 58;" data-composition-id="progress-bar-0" data-composition-src="compositions/tpl/progress-bar.html" data-start="0" data-duration="21.92" data-variable-values='{"at": 0, "dur": 21.92, "color": "#78bdff"}'></div>
      <div id="sticker-host" class="clip subcomp-host" style="z-index: 59;" data-composition-id="sticker-0" data-composition-src="compositions/tpl/sticker.html" data-start="10.6" data-duration="2.6" data-variable-values='{"at": 10.6, "dur": 2.6, "x": 540, "y": 1180, "text": "Safe zone", "icon": "check", "scale": 1.5, "color": "#ffd60a"}'></div>
      <div id="subtitles" class="clip subcomp-host" style="z-index: 75;" data-composition-id="kinetic-subtitle-0" data-composition-src="compositions/tpl/kinetic-subtitle.html" data-start="0" data-duration="21.92" data-variable-values='{"at": 0, "dur": 21.92, "safe": false, "bottom": 470, "size": 60, "mode": "cumulative", "color": "#ffffff", "accent": "#78bdff", "bg": "#1c1c20", "bgAlpha": 0.62, "pill": true, "cues": [{"start": 0.6, "end": 2.6, "text": "Make a *reel* in minutes"}, {"start": 2.8, "end": 4.8, "text": "Captions that stay *readable*"}, {"start": 5.2, "end": 7.4, "text": "Inside the *safe zone*"}, {"start": 7.8, "end": 9.6, "text": "Never under the *buttons*"}, {"start": 10.2, "end": 12.4, "text": "Cards stay off your *face*"}, {"start": 12.8, "end": 14.9, "text": "Numbers *count up* clean"}, {"start": 15.4, "end": 17.6, "text": "One link, one *action*"}, {"start": 18.0, "end": 20.6, "text": "Follow for *more*"}]}'></div>
      <div id="trans-host" class="clip subcomp-host" style="z-index: 90;" data-composition-id="transition-0" data-composition-src="compositions/tpl/transition.html" data-start="9.4" data-duration="0.8" data-variable-values='{"at": 9.4, "dur": 0.8, "kind": "blur"}'></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
