    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: var(--theme-ink);
        font-family: var(--font-apple-display);
        -webkit-font-smoothing: antialiased;
        color: #ffffff;
      }
      #root-composition {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--theme-ink);
      }
      /* WINDOW: animated to a PiP card; ring + shadow are box-shadow so radius/ring stay in true screen pixels */
      #camera-rig {
        position: absolute;
        left: 0; top: 0; width: 1920px; height: 1080px;
        z-index: 10;
        overflow: hidden;
        corner-shape: var(--corner);
        will-change: left, top, width, height, box-shadow;
      }
      /* PAN: fixed-size, only translated/scaled, so footage never re-crops while the window morphs */
      #camera-pan {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        transform-origin: 50% 50%;
        will-change: transform, filter;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #lens-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle 1100px at 50% 45%, transparent 55%, rgba(6, 2, 14, 0.55) 100%);
        pointer-events: none;
        z-index: 15;
      }
      #top-spotlight {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 380px;
        background: radial-gradient(ellipse 900px 320px at 50% -10%, rgba(41, 151, 255, 0.18), transparent 75%);
        pointer-events: none;
        z-index: 16;
      }
      #edge-defocus {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 20;
        opacity: 0;
        box-shadow: inset 0 0 100px 40px rgba(41, 151, 255, 0.25);
      }
      .subcomp-host {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>

      <!-- Kinetic Subtitles (template: cues are data) -->
      <div data-hf-id="hf-iqoi" id="subtitles" class="clip subcomp-host" style="z-index: 75;" data-composition-id="kinetic-subtitle-0" data-composition-src="compositions/tpl/kinetic-subtitle.html" data-start="0" data-duration="21.92" data-variable-values='{"at": 0, "dur": 21.92}'></div>

    <!-- GSAP Master Timeline: camera is data (components/camera.js); everything else is a mounted template -->
    <script>
      window.__timelines = window.__timelines || {};
      const mainTl = gsap.timeline({ paused: true });
      window.__timelines["main"] = mainTl;

      // 1. Speaker window + pan - built from window.__hfCamera (data), same math templates use for face safety
      const cam = window.__hfCamera, R = window.__hfTpl, G = window.__hfGlass.stage;
      R.resolveMoves();
      cam.moves.forEach((m) => {
        const win = m.win && m.win !== "full" ? m.win : G.FULL;
        const end = R.cameraAt(m.t + m.dur);
        G.to(mainTl, cam.rig, win, end, { start: m.t, duration: m.dur, boxShadow: m.chrome && m.chrome.boxShadow, front: m.front });
      });

      // Edge-defocus pulses on the two big reframes
      mainTl.fromTo("#edge-defocus", { opacity: 0 }, { opacity: 0.8, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 5.8);
      mainTl.fromTo("#edge-defocus", { opacity: 0 }, { opacity: 0.85, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, 14.5);

      // Stage backdrop behind the PiP + app window
      mainTl.fromTo("#stage-backdrop", { opacity: 0 }, { opacity: 0.25, duration: 0.8 }, 14.5);
      mainTl.to("#stage-backdrop", { opacity: 0.0, duration: 0.8 }, 18.2);
    </script>
