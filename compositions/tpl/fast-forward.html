<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"at","type":"number","label":"Start (s, absolute)","default":0},
  {"id":"dur","type":"number","label":"Duration (s), the length of the sped-up span","default":3},
  {"id":"safe","type":"boolean","label":"Keep clear of the face","default":true},
  {"id":"side","type":"string","label":"Side (left | right | center)","default":"right"},
  {"id":"top","type":"number","label":"Top (px)","default":60},
  {"id":"offsetX","type":"number","label":"Offset X","default":0},
  {"id":"offsetY","type":"number","label":"Offset Y","default":0},
  {"id":"scale","type":"number","label":"Scale","default":1},
  {"id":"label","type":"string","label":"Speed label","default":"2×"},
  {"id":"caption","type":"string","label":"Caption","default":"Fast-forward"}
]'>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="components/tokens.css">
    <link rel="stylesheet" href="components/apple-glass.css">
    <link rel="stylesheet" href="components/glass-components.css">
    <link rel="stylesheet" href="components/tpl-base.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="components/glass-components.js"></script>
    <script src="components/camera.js"></script>
    <script src="inputs/face-track.js"></script>
    <script src="components/tpl-runtime.js"></script>
    <script src="components/tpl-parts.js"></script>
    <style>
      #ff { display: flex; align-items: center; gap: calc(12px*var(--s)); padding: calc(11px*var(--s)) calc(24px*var(--s)) calc(11px*var(--s)) calc(20px*var(--s));
        border-radius: 100px; white-space: nowrap; }
      .glyph { flex: none; width: calc(34px*var(--s)); height: calc(24px*var(--s)); color: var(--accent); overflow: visible; }
      .glyph path { fill: currentColor; stroke: currentColor; stroke-width: 2.4; stroke-linejoin: round; opacity: 0.4; }
      .lb { font-size: calc(24px*var(--s)); font-weight: 700; letter-spacing: var(--track-title); font-variant-numeric: tabular-nums; line-height: 1; }
      .sep { width: 1px; height: calc(22px*var(--s)); background: var(--separator); }
      .cp { font-size: calc(17px*var(--s)); font-weight: 500; color: var(--label-secondary); line-height: 1; }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="fast-forward" data-width="1920" data-height="1080" data-start="0" data-duration="600">
      <div id="ff" class="hf-glass"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var T = __hfTpl, P = __hfParts, E = __hfGlass.ease, esc = P.esc;
var V = T.vars({at:0,dur:3,safe:true,side:"right",top:60,offsetX:0,offsetY:0,scale:1,label:"2×",caption:"Fast-forward"}, window.__hyperframes);
        var ff = document.getElementById("ff");
        ff.style.setProperty("--s", V.scale);
        ff.innerHTML = '<svg class="glyph" viewBox="0 0 34 24"><path class="a" d="M3 4.2v15.6c0 .9 1 1.4 1.7.9L15.6 13c.6-.5.6-1.5 0-2L4.7 3.3C4 2.8 3 3.3 3 4.2z"/>' +
          '<path class="b" d="M17 4.2v15.6c0 .9 1 1.4 1.7.9L29.6 13c.6-.5.6-1.5 0-2L18.7 3.3C18 2.8 17 3.3 17 4.2z"/></svg>' +
          '<div class="lb">' + esc(V.label) + '</div>' + (V.caption ? '<div class="sep"></div><div class="cp">' + esc(V.caption) + '</div>' : '');
        // footprint used for face-safe placement (mirrored by check-face-clear: w 300*scale, h 60*scale)
        var fw = 300*V.scale, fh = 60*V.scale;
        var pl = T.place({start:V.at,dur:V.dur,side:V.side,width:fw,height:fh,top:V.top,safe:V.safe,offsetX:V.offsetX,offsetY:V.offsetY,minWidth:200});
        ff.style.maxWidth = pl.width + "px";
        var cw = Math.min(ff.offsetWidth || pl.width, pl.width);
        var left = pl.side === "right" ? pl.left + pl.width - cw : pl.side === "center" ? pl.left + (pl.width - cw)/2 : pl.left;
        ff.style.left = left + "px"; ff.style.top = (pl.top + (fh - (ff.offsetHeight || fh))/2) + "px";

        var D = V.dur, tl = gsap.timeline({paused:true}); window.__timelines["fast-forward"] = tl;
        var from = pl.side === "right" ? "right" : pl.side === "left" ? "left" : "up";
        var a = ff.querySelector(".a"), b = ff.querySelector(".b");
        T.enter(tl, ff, {from:from, distance:24, duration:0.55});
        // chase: left triangle lights, then the right one, a finite number of cycles that fits inside dur
        var PER = 0.62, LAG = 0.16, t0 = 0.3, end = D - 0.55;
        var cycles = Math.max(1, Math.floor((end - t0 - LAG) / PER));
        for (var i = 0; i < cycles; i++) {
          var t = t0 + i*PER;
          [[a, 0], [b, LAG]].forEach(function (p) {
            tl.to(p[0], {opacity:1, x:1.5, duration:0.2, ease:"power2.out"}, t + p[1]);
            tl.to(p[0], {opacity:0.4, x:0, duration:0.34, ease:"power2.in"}, t + p[1] + 0.2);
          });
        }
        T.exit(tl, ff, {to:from, at:D - 0.4, duration:0.35});
      })();
    </script>
  </body>
</html>
