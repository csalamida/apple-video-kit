<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"at","type":"number","label":"Start (s, absolute)","default":0},
  {"id":"dur","type":"number","label":"Duration (s)","default":4},
  {"id":"safe","type":"boolean","label":"Keep clear of the face","default":true},
  {"id":"side","type":"string","label":"Side (left | right | center)","default":"left"},
  {"id":"top","type":"number","label":"Top (px)","default":260},
  {"id":"width","type":"number","label":"Width (px)","default":620},
  {"id":"offsetX","type":"number","label":"Offset X","default":0},
  {"id":"offsetY","type":"number","label":"Offset Y","default":0},
  {"id":"scale","type":"number","label":"Text scale","default":1},
  {"id":"text","type":"string","label":"Quote - wrap punch words in *stars*","default":"Reply in the first five minutes and the *booking* is yours."},
  {"id":"attribution","type":"string","label":"Attribution","default":"John Smith"},
  {"id":"role","type":"string","label":"Role (optional)","default":"Founder, Acme"},
  {"id":"size","type":"number","label":"Quote size (px, 34-44)","default":40}
]'>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="components/tokens.css">
    <link rel="stylesheet" href="components/apple-glass.css">
    <link rel="stylesheet" href="components/glass-components.css">
    <link rel="stylesheet" href="components/tpl-base.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="components/glass-components.js"></script>
    <script src="components/camera.js"></script>
    <script src="inputs/face-track.js"></script>
    <script src="components/tpl-runtime.js"></script>
    <script src="components/tpl-parts.js"></script>
    <style>
      #qc { padding: calc(34px*var(--s)) calc(40px*var(--s)) calc(32px*var(--s)); border-radius: 34px; }
      .mk { display: block; width: calc(58px*var(--s)); height: calc(46px*var(--s)); margin-bottom: calc(18px*var(--s)); color: var(--accent); transform-origin: 0 100%; }
      .qt { font-size: calc(var(--q)*var(--s)); font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; color: var(--label); text-wrap: balance; }
      .qt .w { display: inline-block; will-change: transform, opacity, filter; }
      .qt .kw { color: var(--accent-text); }
      .by { display: flex; align-items: center; gap: calc(14px*var(--s)); margin-top: calc(24px*var(--s)); }
      .by .rule { flex: none; width: calc(28px*var(--s)); height: 2px; border-radius: 1px; background: var(--accent); transform-origin: 0 50%; }
      .by .nm { font-size: calc(19px*var(--s)); font-weight: 600; letter-spacing: var(--track-title); }
      .by .rl { font-size: calc(17px*var(--s)); font-weight: 400; color: var(--label-secondary); }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="quote" data-width="1920" data-height="1080" data-start="0" data-duration="600">
      <div id="qc" class="hf-glass"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var T = __hfTpl, P = __hfParts, E = __hfGlass.ease, esc = P.esc;
        var V = T.vars({at:0,dur:4,safe:true,side:"left",top:260,width:620,offsetX:0,offsetY:0,scale:1,text:"Reply in the first five minutes and the *booking* is yours.",attribution:"John Smith",role:"Founder, Acme",size:40}, window.__hyperframes);
        var qc = document.getElementById("qc");
        qc.style.setProperty("--s", V.scale);
        qc.style.setProperty("--q", Math.max(34, Math.min(44, V.size)) + "px");
        var body = String(V.text || "").split(/(\*[^*]+\*)/).filter(Boolean).map(function (part) {
          var punch = /^\*.*\*$/.test(part), txt = punch ? part.slice(1, -1) : part;
          return txt.split(/\s+/).filter(Boolean).map(function (wd) { return '<span class="w' + (punch ? ' kw' : '') + '">' + esc(wd) + '</span>'; }).join(" ");
        }).join(" ");
        qc.innerHTML = '<svg class="mk" viewBox="0 0 46 36"><g fill="currentColor"><circle cx="10" cy="26" r="9.5"/><path d="M0.6 25.5C0.8 14 6.4 5.2 16.6 0.6l2 3.4C12.4 7.4 9.6 12.4 9.3 17.2z"/><circle cx="35" cy="26" r="9.5"/><path d="M25.6 25.5C25.8 14 31.4 5.2 41.6 0.6l2 3.4C37.4 7.4 34.6 12.4 34.3 17.2z"/></g></svg><div class="qt">' + body + '</div>' +
          (V.attribution ? '<div class="by"><div class="rule"></div><div><div class="nm">' + esc(V.attribution) + '</div>' + (V.role ? '<div class="rl">' + esc(V.role) + '</div>' : '') + '</div></div>' : '');

        qc.style.width = V.width + "px";
        var pl = T.place({start:V.at,dur:V.dur,side:V.side,width:V.width,height:qc.offsetHeight,top:V.top,safe:V.safe,offsetX:V.offsetX,offsetY:V.offsetY,minWidth:420});
        qc.style.left = pl.left + "px"; qc.style.top = pl.top + "px"; qc.style.width = pl.width + "px";

        var tl = gsap.timeline({paused:true}); window.__timelines["quote"] = tl;
        var from = pl.side === "right" ? "right" : pl.side === "left" ? "left" : "down";
        T.enter(tl, qc, {from:from, distance:28, duration:0.65});

        var ws = qc.querySelectorAll(".qt .w"), kws = qc.querySelectorAll(".qt .kw"), by = qc.querySelector(".by");
        tl.fromTo(qc.querySelector(".mk"), {opacity:0, scale:0.5, y:10}, {opacity:1, scale:1, y:0, duration:0.6, ease:E.bouncy}, 0.15);
        var st = Math.min(0.08, 1.4 / Math.max(1, ws.length)), wEnd = 0.3 + ws.length * st + 0.6;
        tl.fromTo(ws, {opacity:0, y:14, filter:"blur(8px)"}, {opacity:1, y:0, filter:"blur(0px)", duration:0.6, ease:E.smooth, stagger:st}, 0.3);
        if (kws.length) tl.fromTo(kws, {scale:1}, {scale:1.06, duration:0.18, yoyo:true, repeat:1, ease:"sine.inOut", transformOrigin:"50% 80%"}, wEnd - 0.2);
        if (by) {
          tl.fromTo(by.querySelector(".rule"), {scaleX:0}, {scaleX:1, duration:0.5, ease:E.smooth}, wEnd);
          tl.fromTo(by.querySelector(".rule").nextSibling, {opacity:0, x:-6}, {opacity:1, x:0, duration:0.5, ease:E.smooth}, wEnd + 0.08);
        }
        T.exit(tl, qc, {to:from, at:V.dur - 0.4, duration:0.35});
      })();
    </script>
  </body>
</html>
