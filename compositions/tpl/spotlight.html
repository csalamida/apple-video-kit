<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"at","type":"number","label":"Start (s, absolute)","default":0},
  {"id":"dur","type":"number","label":"Duration (s)","default":3},
  {"id":"safe","type":"boolean","label":"Keep clear of the face","default":true},
  {"id":"x","type":"number","label":"Target X","default":600},
  {"id":"y","type":"number","label":"Target Y","default":300},
  {"id":"w","type":"number","label":"Target width","default":600},
  {"id":"h","type":"number","label":"Target height","default":300},
  {"id":"radius","type":"number","label":"Corner radius","default":28},
  {"id":"strength","type":"number","label":"Dim strength (0-1)","default":0.55},
  {"id":"ring","type":"boolean","label":"Accent ring","default":true}
]'>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="components/tokens.css">
    <link rel="stylesheet" href="components/apple-glass.css">
    <link rel="stylesheet" href="components/glass-components.css">
    <link rel="stylesheet" href="components/tpl-base.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="components/glass-components.js"></script>
    <script src="components/camera.js"></script>
    <script src="inputs/face-track.js"></script>
    <script src="components/canvas.js"></script>
    <script src="components/tpl-runtime.js"></script>
    <script src="components/tpl-parts.js"></script>
    <style>
      #sp { position:absolute; border-radius:28px; corner-shape: var(--corner); box-shadow: 0 0 0 3000px rgba(0,0,0,0.55); opacity:0; }
      #ring { position:absolute; border-radius:28px; corner-shape: var(--corner); border:2px solid var(--accent); box-shadow: 0 0 24px var(--accent-glow); opacity:0; }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="spotlight" data-width="1920" data-height="1080" data-start="0" data-duration="600">
      <div id="sp"></div><div id="ring"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var T = __hfTpl, P = __hfParts, E = __hfGlass.ease, esc = P.esc;
var V = T.vars({at:0,dur:3,safe:true,x:600,y:300,w:600,h:300,radius:28,strength:0.55,ring:true}, window.__hyperframes);
        var sp = document.getElementById("sp"), rg = document.getElementById("ring");
        [sp,rg].forEach(function(e){ e.style.left=V.x+"px"; e.style.top=V.y+"px"; e.style.width=V.w+"px"; e.style.height=V.h+"px"; e.style.borderRadius=V.radius+"px"; });
        sp.style.boxShadow = "0 0 0 3000px rgba(0,0,0,"+V.strength+")";
        var tl = gsap.timeline({paused:true}); window.__timelines["spotlight"] = tl;
        tl.fromTo(sp,{opacity:0},{opacity:1,duration:0.45,ease:E.smooth},0);
        if (V.ring) tl.fromTo(rg,{opacity:0,scale:1.04},{opacity:1,scale:1,duration:0.5,ease:E.snappy},0.1);
        tl.fromTo(V.ring?[sp,rg]:sp,{opacity:1},{opacity:0,duration:0.4,ease:"power2.in",immediateRender:false},Math.max(0.6,V.dur-0.45));
      })();
    </script>
  </body>
</html>
