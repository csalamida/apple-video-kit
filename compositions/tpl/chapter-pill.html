<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"at","type":"number","label":"Start (s, absolute)","default":0},
  {"id":"dur","type":"number","label":"Duration (s)","default":3},
  {"id":"safe","type":"boolean","label":"Keep clear of the face","default":true},
  {"id":"top","type":"number","label":"Top (px)","default":40},
  {"id":"label","type":"string","label":"Series label","default":"Acme CRM Masterclass"},
  {"id":"steps","type":"string","label":"Step badges (JSON)","default":"[\"01\",\"02\",\"03\",\"✓\"]"},
  {"id":"initialLabel","type":"string","label":"Label before first step","default":"3 Core Methods"},
  {"id":"schedule","type":"string","label":"Schedule [{t,step,label}] (step 5 = all done) (JSON)","default":"[{\"t\":5.8,\"step\":1,\"label\":\"Method 01: Manual\"},{\"t\":8.8,\"step\":2,\"label\":\"Method 02: Spreadsheet\"},{\"t\":11.6,\"step\":3,\"label\":\"Method 03: Lead Form\"},{\"t\":14.5,\"step\":4,\"label\":\"Verification Climax\"},{\"t\":18.2,\"step\":5,\"label\":\"Details Verified ✓\"}]"}
]'>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="components/tokens.css">
    <link rel="stylesheet" href="components/apple-glass.css">
    <link rel="stylesheet" href="components/glass-components.css">
    <link rel="stylesheet" href="components/tpl-base.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="components/glass-components.js"></script>
    <script src="components/camera.js"></script>
    <script src="inputs/face-track.js"></script>
    <script src="components/canvas.js"></script>
    <script src="components/tpl-runtime.js"></script>
    <script src="components/tpl-parts.js"></script>
    <style>
      #cp { position:absolute; left:50%; transform: translateX(-50%); display:flex; align-items:center; gap:14px; padding:10px 24px; border-radius:100px; opacity:1; }
      .dot { width:8px; height:8px; border-radius:50%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
      .ttl { font-size:14px; font-weight:600; letter-spacing: var(--track-label); text-transform: uppercase; }
      .sep { width:1px; height:14px; background: rgba(255,255,255,.25); }
      .trk { display:flex; gap:6px; }
      .bd { width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; background: rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.28); }
      .lbls { display:grid; } .lbls span { grid-area:1/1; font-size:13px; font-weight:600; opacity:0; white-space:nowrap; }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="chapter-pill" data-width="1920" data-height="1080" data-start="0" data-duration="600">
      <div id="cp" class="hf-glass"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var T = __hfTpl, P = __hfParts, E = __hfGlass.ease, esc = P.esc;
var V = T.vars({at:0,dur:3,safe:true,side:"left",top:40,offsetX:0,offsetY:0,scale:1.1,label:"Acme CRM Masterclass",steps:"[\"01\",\"02\",\"03\",\"✓\"]",initialLabel:"3 Core Methods",schedule:"[{\"t\":5.8,\"step\":1,\"label\":\"Method 01: Manual\"},{\"t\":8.8,\"step\":2,\"label\":\"Method 02: Spreadsheet\"},{\"t\":11.6,\"step\":3,\"label\":\"Method 03: Lead Form\"},{\"t\":14.5,\"step\":4,\"label\":\"Verification Climax\"},{\"t\":18.2,\"step\":5,\"label\":\"Details Verified ✓\"}]"}, window.__hyperframes);
        V.steps = T.json(V.steps, []); V.schedule = T.json(V.schedule, []);
        var cp = document.getElementById("cp"); cp.style.top = V.top+"px";
        var labels = [V.initialLabel].concat(V.schedule.map(function(s){return s.label;}));
        cp.innerHTML = '<div class="dot"></div><div class="ttl">'+esc(V.label)+'</div><div class="sep"></div><div class="trk">'+V.steps.map(function(s,i){return '<span class="bd" id="bd'+i+'">'+esc(s)+'</span>';}).join("")+'</div><div class="sep"></div><div class="lbls">'+labels.map(function(l,i){return '<span id="lb'+i+'">'+esc(l)+'</span>';}).join("")+'</div>';
        var IDLE={backgroundColor:"rgba(255,255,255,0.12)",color:"#ffffff",borderColor:"rgba(255,255,255,0.28)"},
            ACT={backgroundColor:"#0a60d0",color:"#ffffff",borderColor:"rgba(0,0,0,0)"},
            DONE={backgroundColor:"rgba(48,209,88,0.18)",color:"#a6f0bb",borderColor:"rgba(48,209,88,0.55)"};
        var tl = gsap.timeline({paused:true}); window.__timelines["chapter-pill"] = tl;
        var badge = function(step,i){ return step>V.steps.length || i < step-1 ? DONE : i===step-1 ? ACT : IDLE; };
        // starting state (schedule entries at or before the start fold into it) as one hold per element at 0:
        // two zero-duration sets on the same element at 0 revert when the playhead seeks back to 0
        var hold = function(el, v){ var b = {}; for (var k in v) b[k] = v[k]; b.duration = 0.001; tl.fromTo(el, v, b, 0); };
        var k0 = 0, step0 = 0;
        V.schedule.forEach(function(s,k){ if (s.t - V.at <= 0) { k0 = k + 1; step0 = s.step; } });
        hold(cp,{opacity:1});
        labels.forEach(function(_,k){ hold("#lb"+k,{opacity:k===k0?1:0}); });
        V.steps.forEach(function(_,i){ hold("#bd"+i, step0 ? badge(step0,i) : IDLE); });
        V.schedule.forEach(function(s,k){
          var t = s.t - V.at;
          if (t <= 0) return;
          tl.set("#lb"+k,{opacity:0},t); tl.set("#lb"+(k+1),{opacity:1},t);
          V.steps.forEach(function(_,i){ tl.set("#bd"+i, badge(s.step,i), t); });
        });
      })();
    </script>
  </body>
</html>
