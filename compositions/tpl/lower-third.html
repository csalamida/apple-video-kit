<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"at","type":"number","label":"Start (s, absolute)","default":0},
  {"id":"dur","type":"number","label":"Duration (s)","default":3},
  {"id":"safe","type":"boolean","label":"Keep clear of the face","default":true},
  {"id":"side","type":"string","label":"Side (left | right | center)","default":"left"},
  {"id":"top","type":"number","label":"Top (px)","default":900},
  {"id":"offsetX","type":"number","label":"Offset X","default":0},
  {"id":"offsetY","type":"number","label":"Offset Y","default":0},
  {"id":"scale","type":"number","label":"Text scale","default":1.1},
  {"id":"name","type":"string","label":"Name","default":"John Smith"},
  {"id":"role","type":"string","label":"Role","default":"Acme CRM Automation Lead"},
  {"id":"initials","type":"string","label":"Initials","default":"JS"},
  {"id":"verified","type":"boolean","label":"Verified seal","default":true}
]'>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="components/tokens.css">
    <link rel="stylesheet" href="components/apple-glass.css">
    <link rel="stylesheet" href="components/glass-components.css">
    <link rel="stylesheet" href="components/tpl-base.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="components/glass-components.js"></script>
    <script src="components/camera.js"></script>
    <script src="inputs/face-track.js"></script>
    <script src="components/canvas.js"></script>
    <script src="components/tpl-runtime.js"></script>
    <script src="components/tpl-parts.js"></script>
    <style>
      #lt { display: flex; align-items: center; gap: 16px; padding: 12px 28px 12px 14px; border-radius: 100px; }
      .av { width: calc(52px*var(--s)); height: calc(52px*var(--s)); border-radius: 50%; background: linear-gradient(135deg,#0a60d0,#2997ff); display:flex;align-items:center;justify-content:center; font-weight:700; font-size: calc(18px*var(--s)); border:1.5px solid rgba(255,255,255,.55); flex:none; }
      .nm { font-size: calc(22px*var(--s)); font-weight: 700; letter-spacing: var(--track-title); display:flex; align-items:center; gap:8px; }
      .nm svg { color: var(--accent); }
      .rl { font-size: calc(14px*var(--s)); color: var(--label-secondary); margin-top: 2px; }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="lower-third" data-width="1920" data-height="1080" data-start="0" data-duration="600">
      <div id="lt" class="hf-glass"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var T = __hfTpl, P = __hfParts, E = __hfGlass.ease, esc = P.esc;
var V = T.vars({at:0,dur:3,safe:true,side:"left",top:900,offsetX:0,offsetY:0,scale:1.1,name:"John Smith",role:"Acme CRM Automation Lead",initials:"JS",verified:true}, window.__hyperframes);
        var lt = document.getElementById("lt");
        lt.style.setProperty("--s", V.scale);
        lt.innerHTML = '<div class="av">'+esc(V.initials)+'</div><div><div class="nm">'+esc(V.name)+(V.verified?P.icon("seal",20):"")+'</div><div class="rl">'+esc(V.role)+'</div></div>';
        P.ensureSymbols();
        var h = 76*V.scale, pl = T.place({start:V.at,dur:V.dur,side:V.side,width:560,height:h,top:V.top,safe:V.safe,offsetX:V.offsetX,offsetY:V.offsetY,minWidth:300});
        lt.style.left = pl.left+"px"; lt.style.top = pl.top+"px";
        var tl = gsap.timeline({paused:true}); window.__timelines["lower-third"] = tl;
        var from = pl.side==="right"?"right":"left";
        T.enter(tl, lt, {from:from, distance:24, duration:0.55});
        T.exit(tl, lt, {to:from, at:V.dur-0.4, duration:0.35});
      })();
    </script>
  </body>
</html>
