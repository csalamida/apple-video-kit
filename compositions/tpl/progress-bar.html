<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"at","type":"number","label":"Start (s, absolute)","default":0},
  {"id":"dur","type":"number","label":"Duration (s)","default":3},
  {"id":"edge","type":"string","label":"Edge (top | bottom)","default":"top"},
  {"id":"y","type":"number","label":"Distance from the edge (px, -1 = just inside the safe zone)","default":-1},
  {"id":"thickness","type":"number","label":"Thickness (px)","default":10},
  {"id":"color","type":"color","label":"Fill colour","default":"#2997ff"},
  {"id":"track","type":"color","label":"Track colour","default":"#ffffff"},
  {"id":"trackAlpha","type":"number","label":"Track opacity (0-1)","default":0.22},
  {"id":"inset","type":"number","label":"Side inset (px, -1 = safe zone)","default":-1}
]'>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="components/tokens.css">
    <link rel="stylesheet" href="components/apple-glass.css">
    <link rel="stylesheet" href="components/glass-components.css">
    <link rel="stylesheet" href="components/tpl-base.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="components/glass-components.js"></script>
    <script src="components/camera.js"></script>
    <script src="inputs/face-track.js"></script>
    <script src="components/canvas.js"></script>
    <script src="components/tpl-runtime.js"></script>
    <script src="components/tpl-parts.js"></script>
    <style>
      #pb { position: absolute; border-radius: 100px; overflow: hidden; opacity: 0; will-change: opacity; }
      #fill { position: absolute; inset: 0; transform-origin: 0 50%; border-radius: 100px; }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="progress-bar" data-width="1920" data-height="1080" data-start="0" data-duration="600">
      <div id="pb"><div id="fill"></div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var T = __hfTpl, P = __hfParts, E = __hfGlass.ease, esc = P.esc;
var V = T.vars({at:0,dur:3,edge:"top",y:-1,thickness:10,color:"#2997ff",track:"#ffffff",trackAlpha:0.22,inset:-1}, window.__hyperframes);
        var S = T.safeZone, W = T.W, H = T.H, th = Math.max(2, +V.thickness || 10);
        var inset = V.inset >= 0 ? V.inset : Math.max(S.left, 48), right = V.inset >= 0 ? V.inset : Math.max(S.right, 48);
        var y = V.y >= 0 ? V.y : (V.edge === "bottom" ? Math.max(S.bottom, 40) : Math.max(S.top, 40)) + 12;
        var pb = document.getElementById("pb"), fill = document.getElementById("fill");
        pb.style.left = inset + "px"; pb.style.width = (W - inset - right) + "px"; pb.style.height = th + "px";
        pb.style.top = (V.edge === "bottom" ? H - y - th : y) + "px";
        var hex = String(V.track).replace("#",""); if (hex.length === 3) hex = hex.replace(/./g, function (c) { return c + c; });
        var n = parseInt(hex, 16), a = Math.max(0, Math.min(1, +V.trackAlpha));
        pb.style.background = /^[0-9a-f]{6}$/i.test(hex) ? "rgba(" + (n>>16&255) + "," + (n>>8&255) + "," + (n&255) + "," + a + ")" : V.track;
        fill.style.background = V.color;
        var D = V.dur, tl = gsap.timeline({paused:true}); window.__timelines["progress-bar"] = tl;
        // pure function of time: the fill is exactly (t / dur) wide; the bar fades in and out around it
        tl.fromTo(fill, {scaleX:0}, {scaleX:1, duration:D, ease:"none"}, 0);
        tl.fromTo(pb, {opacity:0}, {opacity:1, duration:Math.min(0.3, D/4), ease:"power2.out"}, 0);
        tl.fromTo(pb, {opacity:1}, {opacity:0, duration:Math.min(0.3, D/4), ease:"power2.in", immediateRender:false}, D - Math.min(0.3, D/4));
      })();
    </script>
  </body>
</html>
