<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"at","type":"number","label":"Start (s, absolute)","default":0},
  {"id":"dur","type":"number","label":"Duration (s)","default":3},
  {"id":"safe","type":"boolean","label":"Keep clear of the face","default":true},
  {"id":"bottom","type":"number","label":"Bottom (px)","default":46},
  {"id":"size","type":"number","label":"Font size (px)","default":38},
  {"id":"cues","type":"string","label":"Cues [{start,end,text}] - wrap punch words in *stars* (JSON)","default":"[{\"start\":1.8,\"end\":2.5,\"text\":\"In this video,\"},{\"start\":2.5,\"end\":3.4,\"text\":\"I&#39;ll show you\"},{\"start\":3.4,\"end\":4.4,\"text\":\"Three *ways*\"},{\"start\":4.4,\"end\":5.0,\"text\":\"to add contacts\"},{\"start\":5.0,\"end\":5.8,\"text\":\"to *Acme CRM.*\"},{\"start\":5.8,\"end\":6.6,\"text\":\"You can add\"},{\"start\":6.6,\"end\":7.9,\"text\":\"someone *manually,*\"},{\"start\":8.8,\"end\":10.2,\"text\":\"from a *spreadsheet,*\"},{\"start\":10.2,\"end\":11.6,\"text\":\"or collect their details\"},{\"start\":11.6,\"end\":13.5,\"text\":\"through a *form.*\"},{\"start\":14.5,\"end\":15.6,\"text\":\"And after each *one,*\"},{\"start\":15.6,\"end\":17.0,\"text\":\"we&#39;ll open the *contact*\"},{\"start\":17.0,\"end\":18.2,\"text\":\"and make *sure*\"},{\"start\":18.2,\"end\":20.8,\"text\":\"the *details* are there.\"}]"}
]'>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="components/tokens.css">
    <link rel="stylesheet" href="components/apple-glass.css">
    <link rel="stylesheet" href="components/glass-components.css">
    <link rel="stylesheet" href="components/tpl-base.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="components/glass-components.js"></script>
    <script src="components/camera.js"></script>
    <script src="inputs/face-track.js"></script>
    <script src="components/tpl-runtime.js"></script>
    <script src="components/tpl-parts.js"></script>
    <style>
      #dock { position:absolute; left:50%; transform: translateX(-50%); text-align:center; }
      .cue { display:none; font-weight:600; letter-spacing: var(--track-display); line-height:1.2; color:#fff; background: rgba(28,28,32,.62);
             border: 1px solid rgba(255,255,255,.28); -webkit-backdrop-filter: var(--glass-filter-thin); backdrop-filter: var(--glass-filter-thin);
             border-radius:100px; padding:12px 38px; box-shadow: inset 0 1px 1.5px rgba(255,255,255,.5), 0 16px 40px rgba(0,0,0,.8); white-space:nowrap; }
      .cue .w { display:inline-block; margin:0 .16em; transform-origin:50% 80%; }
      .cue .kw { color: var(--accent-text); font-weight:700; }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="kinetic-subtitle" data-width="1920" data-height="1080" data-start="0" data-duration="600">
      <div id="dock"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var T = __hfTpl, P = __hfParts, E = __hfGlass.ease, esc = P.esc;
var V = T.vars({at:0,dur:3,safe:true,side:"left",top:140,offsetX:0,offsetY:0,scale:1.1,bottom:46,size:38,cues:"[]"}, window.__hyperframes);
        V.cues = T.json(V.cues, []);
        var dock = document.getElementById("dock"); dock.style.bottom = V.bottom+"px";
        var tl = gsap.timeline({paused:true}); window.__timelines["kinetic-subtitle"] = tl;
        V.cues.forEach(function(c,i){
          var el = document.createElement("div"); el.className = "cue"; el.style.fontSize = V.size+"px";
          el.innerHTML = c.text.split(/(\*[^*]+\*)/).filter(Boolean).map(function(part){
            var punch = /^\*.*\*$/.test(part), txt = punch ? part.slice(1,-1) : part;
            return txt.split(/\s+/).filter(Boolean).map(function(wd){ return '<span class="w'+(punch?' kw':'')+'">'+esc(wd)+'</span>'; }).join(" ");
          }).join(" ");
          dock.appendChild(el);
          var s = c.start - V.at, e = c.end - V.at, words = el.querySelectorAll(".w"), kw = el.querySelector(".kw");
          tl.set(el,{display:"inline-block",opacity:0,scale:0.92,y:10},s);
          tl.to(el,{opacity:1,scale:1,y:0,duration:0.24,ease:E.snappy},s);
          if (words.length) tl.fromTo(words,{opacity:0,scale:0.8,y:6},{opacity:1,scale:1,y:0,duration:0.2,stagger:0.045,ease:E.snappy},s+0.02);
          if (kw) tl.to(kw,{scale:1.1,duration:0.16,yoyo:true,repeat:1,ease:"sine.inOut"},s+0.16);
          tl.to(el,{opacity:0,scale:0.96,y:-6,duration:0.16,ease:"power2.in"},Math.max(s+0.25,e-0.16));
          tl.set(el,{display:"none"},e);
        });
      })();
    </script>
  </body>
</html>
