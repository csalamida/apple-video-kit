<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"at","type":"number","label":"Start (s, absolute)","default":0},
  {"id":"dur","type":"number","label":"Duration (s)","default":4.5},
  {"id":"safe","type":"boolean","label":"Keep clear of the face","default":true},
  {"id":"side","type":"string","label":"Side (left | right | center)","default":"right"},
  {"id":"top","type":"number","label":"Top (px)","default":200},
  {"id":"width","type":"number","label":"Width (px)","default":520},
  {"id":"offsetX","type":"number","label":"Offset X","default":0},
  {"id":"offsetY","type":"number","label":"Offset Y","default":0},
  {"id":"scale","type":"number","label":"Text scale","default":1},
  {"id":"eyebrow","type":"string","label":"Eyebrow","default":"Recap"},
  {"id":"title","type":"string","label":"Title","default":"Before you move on"},
  {"id":"items","type":"string","label":"Items (JSON list of strings)","default":"[\"Add the contact\",\"Send the form\",\"Check the details\"]"},
  {"id":"first","type":"number","label":"First tick (s after start)","default":0.9},
  {"id":"stagger","type":"number","label":"Seconds between ticks","default":0.7}
]'>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="components/tokens.css">
    <link rel="stylesheet" href="components/apple-glass.css">
    <link rel="stylesheet" href="components/glass-components.css">
    <link rel="stylesheet" href="components/tpl-base.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="components/glass-components.js"></script>
    <script src="components/camera.js"></script>
    <script src="inputs/face-track.js"></script>
    <script src="components/tpl-runtime.js"></script>
    <script src="components/tpl-parts.js"></script>
    <style>
      #cl { padding: calc(28px*var(--s)) calc(30px*var(--s)) calc(22px*var(--s)); border-radius: 32px; }
      .hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: calc(14px*var(--s)); }
      .eb { font-size: calc(14px*var(--s)); font-weight: 600; letter-spacing: var(--track-label); text-transform: uppercase; color: var(--accent-text); margin-bottom: calc(6px*var(--s)); }
      .tt { font-size: calc(30px*var(--s)); font-weight: 700; line-height: 1.12; letter-spacing: var(--track-display); }
      .cnt { position: relative; flex: none; height: calc(30px*var(--s)); min-width: calc(58px*var(--s)); padding: 0 calc(12px*var(--s)); border-radius: 100px;
             background: var(--fill-1); font-size: calc(15px*var(--s)); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--label-secondary); margin-bottom: 2px; }
      .cnt span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
      .cnt span.all { color: var(--green); }
      .rows { display: flex; flex-direction: column; }
      .row { display: flex; align-items: center; gap: calc(16px*var(--s)); padding: calc(13px*var(--s)) 0; border-top: 0.5px solid var(--separator); }
      .row:first-child { border-top: 0; }
      .ck { position: relative; flex: none; width: calc(32px*var(--s)); height: calc(32px*var(--s)); }
      .ck .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(235,235,245,.42); }
      .ck .fill { position: absolute; inset: 0; border-radius: 50%; background: var(--green); transform: scale(0);
                  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 12px rgba(48,209,88,.35); }
      .ck svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .ck path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; }
      .tx { font-size: calc(22px*var(--s)); font-weight: 500; line-height: 1.25; letter-spacing: var(--track-title); color: var(--label-secondary); }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="checklist" data-width="1920" data-height="1080" data-start="0" data-duration="600">
      <div id="cl" class="hf-glass"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var T = __hfTpl, P = __hfParts, E = __hfGlass.ease, esc = P.esc;
        var V = T.vars({at:0,dur:4.5,safe:true,side:"right",top:200,width:520,offsetX:0,offsetY:0,scale:1,eyebrow:"Recap",title:"Before you move on",items:"[\"Add the contact\",\"Send the form\",\"Check the details\"]",first:0.9,stagger:0.7}, window.__hyperframes);
        var items = T.json(V.items, []); if (!Array.isArray(items)) items = [];
        var n = items.length, cl = document.getElementById("cl");
        cl.style.setProperty("--s", V.scale);
        var counts = ''; for (var c = 0; c <= n; c++) counts += '<span' + (c === n ? ' class="all"' : '') + '>' + c + ' of ' + n + '</span>';
        cl.innerHTML = '<div class="hd"><div>' + (V.eyebrow ? '<div class="eb">' + esc(V.eyebrow) + '</div>' : '') + '<div class="tt">' + esc(V.title) + '</div></div>' +
          (n ? '<div class="cnt">' + counts + '</div>' : '') + '</div><div class="rows">' + items.map(function (it) {
            return '<div class="row"><div class="ck"><div class="ring"></div><div class="fill"></div><svg viewBox="0 0 32 32"><path d="M10 16.5l4 4 8-8.5"/></svg></div><div class="tx">' + esc(it) + '</div></div>';
          }).join('') + '</div>';

        cl.style.width = V.width + "px";
        var pl = T.place({start:V.at,dur:V.dur,side:V.side,width:V.width,height:cl.offsetHeight,top:V.top,safe:V.safe,offsetX:V.offsetX,offsetY:V.offsetY,minWidth:360});
        cl.style.left = pl.left + "px"; cl.style.top = pl.top + "px"; cl.style.width = pl.width + "px";

        var tl = gsap.timeline({paused:true}); window.__timelines["checklist"] = tl;
        var from = pl.side === "right" ? "right" : pl.side === "left" ? "left" : "down";
        T.enter(tl, cl, {from:from, distance:28, duration:0.65});

        var rows = cl.querySelectorAll(".row"), spans = cl.querySelectorAll(".cnt span");
        tl.fromTo(rows, {opacity:0, y:10}, {opacity:1, y:0, duration:0.5, ease:E.smooth, stagger:0.07}, 0.22);
        if (spans.length) tl.fromTo(spans[0], {opacity:1}, {opacity:1, duration:0.001}, 0);

        for (var i = 0; i < rows.length; i++) {
          var t = V.first + i * V.stagger, r = rows[i];
          tl.fromTo(r.querySelector(".fill"), {scale:0}, {scale:1, duration:0.45, ease:E.bouncy}, t);
          tl.fromTo(r.querySelector(".ring"), {opacity:1}, {opacity:0, duration:0.2, ease:"power1.out"}, t + 0.05);
          tl.fromTo(r.querySelector("path"), {strokeDashoffset:20}, {strokeDashoffset:0, duration:0.3, ease:"power2.out"}, t + 0.12);
          tl.fromTo(r.querySelector(".tx"), {color:"rgba(235,235,245,0.78)"}, {color:"rgba(255,255,255,1)", duration:0.3, ease:"power1.out"}, t + 0.1);
          tl.fromTo(r.querySelector(".ck"), {scale:1}, {scale:1.12, duration:0.14, yoyo:true, repeat:1, ease:"sine.inOut"}, t);
          tl.set(spans[i], {opacity:0}, t + 0.1);
          tl.set(spans[i + 1], {opacity:1}, t + 0.1);
        }
        T.exit(tl, cl, {to:from, at:V.dur - 0.4, duration:0.35});
      })();
    </script>
  </body>
</html>
