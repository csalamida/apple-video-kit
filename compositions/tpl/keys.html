<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"at","type":"number","label":"Start (s, absolute)","default":0},
  {"id":"dur","type":"number","label":"Duration (s)","default":2.5},
  {"id":"safe","type":"boolean","label":"Keep clear of the face","default":true},
  {"id":"side","type":"string","label":"Side (left | right | center)","default":"center"},
  {"id":"top","type":"number","label":"Top (px)","default":820},
  {"id":"offsetX","type":"number","label":"Offset X","default":0},
  {"id":"offsetY","type":"number","label":"Offset Y","default":0},
  {"id":"scale","type":"number","label":"Scale","default":1},
  {"id":"keys","type":"string","label":"Keys, in press order (JSON list)","default":"[\"⌘\",\"K\"]"},
  {"id":"label","type":"string","label":"Caption (optional)","default":"Open command bar"}
]'>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="components/tokens.css">
    <link rel="stylesheet" href="components/apple-glass.css">
    <link rel="stylesheet" href="components/glass-components.css">
    <link rel="stylesheet" href="components/tpl-base.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="components/glass-components.js"></script>
    <script src="components/camera.js"></script>
    <script src="inputs/face-track.js"></script>
    <script src="components/canvas.js"></script>
    <script src="components/tpl-runtime.js"></script>
    <script src="components/tpl-parts.js"></script>
    <style>
      #kb { display: flex; align-items: center; gap: calc(12px*var(--s)); padding: calc(14px*var(--s)) calc(18px*var(--s)) calc(17px*var(--s));
            border-radius: calc(28px*var(--s)); white-space: nowrap; }
      .k { position: relative; flex: none; height: calc(66px*var(--s)); }
      .kf { position: relative; height: calc(63px*var(--s)); min-width: calc(63px*var(--s)); padding: 0 calc(18px*var(--s));
            display: flex; align-items: center; justify-content: center; border-radius: calc(15px*var(--s)); corner-shape: var(--corner);
            background-color: #34343a; background-image: linear-gradient(180deg, #4a4a52 0%, #34343a 55%, #2c2c31 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.34), inset 0 -1.5px 0 rgba(0,0,0,.35), 0 3px 0 #121216, 0 6px 14px rgba(0,0,0,.45);
            color: var(--label); font-family: var(--font-ui); font-weight: 500; font-size: calc(29px*var(--s)); line-height: 1; overflow: hidden; }
      .kf.sym { font-size: calc(33px*var(--s)); }
      .kf.word { font-family: var(--font-ui); font-size: calc(20px*var(--s)); font-weight: 600; letter-spacing: var(--track-title); }
      .kf .shade { position: absolute; inset: 0; background: rgba(0,0,0,.30); opacity: 0; pointer-events: none; }
      .kf span { position: relative; }
      .plus { flex: none; font-size: calc(22px*var(--s)); font-weight: 400; color: var(--label); margin-top: calc(-3px*var(--s)); }
      .sep { flex: none; width: 1px; height: calc(36px*var(--s)); background: var(--separator); margin: 0 calc(6px*var(--s)) 0 calc(8px*var(--s)); }
      .lb { flex: none; font-size: calc(22px*var(--s)); font-weight: 500; letter-spacing: var(--track-title); color: var(--label); padding-right: calc(8px*var(--s)); margin-top: calc(-3px*var(--s)); }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="keys" data-width="1920" data-height="1080" data-start="0" data-duration="600">
      <div id="kb" class="hf-glass"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var T = __hfTpl, P = __hfParts, E = __hfGlass.ease, esc = P.esc;
        var V = T.vars({at:0,dur:2.5,safe:true,side:"center",top:820,offsetX:0,offsetY:0,scale:1,keys:"[\"⌘\",\"K\"]",label:"Open command bar"}, window.__hyperframes);
        var keys = T.json(V.keys, ["⌘","K"]); if (!Array.isArray(keys) || !keys.length) keys = ["⌘","K"];
        var kb = document.getElementById("kb");
        kb.style.setProperty("--s", V.scale);
        kb.innerHTML = keys.map(function (k, i) {
          k = String(k);
          return (i ? '<span class="plus">+</span>' : '') + '<div class="k"><div class="kf' + (k.length > 1 ? ' word' : '') + '"><span>' + esc(k) + '</span><div class="shade"></div></div></div>';
        }).join('') + (V.label ? '<div class="sep"></div><div class="lb">' + esc(V.label) + '</div>' : '');

        var w = kb.offsetWidth, h = kb.offsetHeight;
        var pl = T.place({start:V.at,dur:V.dur,side:V.side,width:w,height:h,top:V.top,safe:V.safe,offsetX:V.offsetX,offsetY:V.offsetY,minWidth:w});
        kb.style.left = pl.left + "px"; kb.style.top = pl.top + "px";

        var tl = gsap.timeline({paused:true}); window.__timelines["keys"] = tl;
        var from = pl.side === "right" ? "right" : pl.side === "left" ? "left" : "down";
        T.enter(tl, kb, {from:from, distance:20, duration:0.6});

        var caps = kb.querySelectorAll(".k"), faces = kb.querySelectorAll(".kf"), shades = kb.querySelectorAll(".shade"), plus = kb.querySelectorAll(".plus");
        tl.fromTo(caps, {opacity:0, scale:0.55, y:8}, {opacity:1, scale:1, y:0, duration:0.55, ease:E.bouncy, stagger:0.09}, 0.12);
        if (plus.length) tl.fromTo(plus, {opacity:0}, {opacity:1, duration:0.3, stagger:0.09, ease:"power1.out"}, 0.22);

        // Chord: press each key in order and hold, then release together.
        var UP = "inset 0 1px 0 rgba(255,255,255,.34), inset 0 -1.5px 0 rgba(0,0,0,.35), 0 3px 0 #121216, 0 6px 14px rgba(0,0,0,.45)";
        var DOWN = "inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1.5px 0 rgba(0,0,0,.35), 0 0px 0 #121216, 0 2px 5px rgba(0,0,0,.45)";
        var p0 = 0.75, gap = 0.16, release = p0 + (faces.length - 1) * gap + 0.32;
        for (var i = 0; i < faces.length; i++) {
          tl.fromTo(faces[i], {y:0, boxShadow:UP}, {y:3, boxShadow:DOWN, duration:0.12, ease:"power2.out", immediateRender:false}, p0 + i * gap);
          tl.fromTo(shades[i], {opacity:0}, {opacity:1, duration:0.12, ease:"power2.out", immediateRender:false}, p0 + i * gap);
        }
        tl.fromTo(faces, {y:3, boxShadow:DOWN}, {y:0, boxShadow:UP, duration:0.22, ease:E.snappy, immediateRender:false}, release);
        tl.fromTo(shades, {opacity:1}, {opacity:0, duration:0.18, ease:"power1.out", immediateRender:false}, release);

        var sep = kb.querySelector(".sep"), lb = kb.querySelector(".lb");
        if (lb) tl.fromTo([sep, lb], {opacity:0, x:-8}, {opacity:1, x:0, duration:0.5, ease:E.smooth, stagger:0.05}, 0.3);

        T.exit(tl, kb, {to:from, distance:16, at:V.dur - 0.4, duration:0.32});
      })();
    </script>
  </body>
</html>
