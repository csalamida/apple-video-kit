<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"at","type":"number","label":"Start (s, absolute)","default":0},
  {"id":"dur","type":"number","label":"Duration (s)","default":3},
  {"id":"safe","type":"boolean","label":"Keep clear of the face","default":true},
  {"id":"side","type":"string","label":"Side (left | right | center)","default":"right"},
  {"id":"top","type":"number","label":"Top (px)","default":200},
  {"id":"width","type":"number","label":"Width (px)","default":520},
  {"id":"height","type":"number","label":"Min height (px)","default":330},
  {"id":"offsetX","type":"number","label":"Offset X","default":0},
  {"id":"offsetY","type":"number","label":"Offset Y","default":0},
  {"id":"scale","type":"number","label":"Text scale","default":1.1},
  {"id":"name","type":"string","label":"Name","default":"John Smith"},
  {"id":"initials","type":"string","label":"Initials","default":"JS"},
  {"id":"verifiedText","type":"string","label":"Verified text","default":"Verified Contact"},
  {"id":"fields","type":"string","label":"Fields [{label,value,tone}] (JSON)","default":"[{\"label\":\"Email\",\"value\":\"john@growth.io\"},{\"label\":\"Phone\",\"value\":\"+1 (555) 019-8234\"},{\"label\":\"Source\",\"value\":\"Opt-in Form\"},{\"label\":\"Status\",\"value\":\"Active Lead\",\"tone\":\"good\"}]"},
  {"id":"stagger","type":"number","label":"Tile stagger (s)","default":0.45}
]'>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="components/tokens.css">
    <link rel="stylesheet" href="components/apple-glass.css">
    <link rel="stylesheet" href="components/glass-components.css">
    <link rel="stylesheet" href="components/tpl-base.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="components/glass-components.js"></script>
    <script src="components/camera.js"></script>
    <script src="inputs/face-track.js"></script>
    <script src="components/tpl-runtime.js"></script>
    <script src="components/tpl-parts.js"></script>
    <style>
      #cc { padding: 28px 30px; border-radius: 30px; }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="contact-card" data-width="1920" data-height="1080" data-start="0" data-duration="600">
      <div id="cc" class="hf-glass"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var T = __hfTpl, P = __hfParts, E = __hfGlass.ease, esc = P.esc;
var V = T.vars({at:0,dur:3,safe:true,side:"right",top:200,width:520,height:330,offsetX:0,offsetY:0,scale:1.1,name:"John Smith",initials:"JS",verifiedText:"Verified Contact",fields:"[{\"label\":\"Email\",\"value\":\"john@growth.io\"},{\"label\":\"Phone\",\"value\":\"+1 (555) 019-8234\"},{\"label\":\"Source\",\"value\":\"Opt-in Form\"},{\"label\":\"Status\",\"value\":\"Active Lead\",\"tone\":\"good\"}]",stagger:0.45}, window.__hyperframes);
        V.fields = T.json(V.fields, []); P.ensureSymbols();
        P.useCss("contact");
        var cc = document.getElementById("cc"); cc.style.setProperty("--s", V.scale);
        cc.innerHTML = P.contact({name:V.name, initials:V.initials, verifiedText:V.verifiedText, fields:V.fields});
        var pl = T.place({start:V.at,dur:V.dur,side:V.side,width:V.width,height:V.height,top:V.top,safe:V.safe,offsetX:V.offsetX,offsetY:V.offsetY,minWidth:360});
        cc.style.cssText += ";left:"+pl.left+"px;top:"+pl.top+"px;width:"+pl.width+"px;min-height:"+V.height+"px";
        var tl = gsap.timeline({paused:true}); window.__timelines["contact-card"] = tl;
        var from = pl.side==="left"?"left":"right";
        T.enter(tl, cc, {from:from, duration:0.65});
        tl.fromTo(cc.querySelectorAll(".it"),{opacity:0,y:10,scale:0.92},{opacity:1,y:0,scale:1,duration:0.45,stagger:V.stagger,ease:E.snappy},0.35);
        T.exit(tl, cc, {to:from, at:V.dur-0.4, duration:0.35});
      })();
    </script>
  </body>
</html>
