<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"at","type":"number","label":"Start (s, absolute)","default":0},
  {"id":"dur","type":"number","label":"Duration (s)","default":3},
  {"id":"x","type":"number","label":"Centre X (px on the frame)","default":960},
  {"id":"y","type":"number","label":"Centre Y (px on the frame)","default":400},
  {"id":"text","type":"string","label":"Text","default":"New"},
  {"id":"icon","type":"string","label":"Icon (leave empty for none)","default":"sparkle"},
  {"id":"rotate","type":"number","label":"Tilt (deg)","default":-6},
  {"id":"scale","type":"number","label":"Scale","default":1},
  {"id":"color","type":"color","label":"Sticker colour","default":"#ffd60a"},
  {"id":"ink","type":"color","label":"Text colour","default":"#1c1c20"}
]'>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="components/tokens.css">
    <link rel="stylesheet" href="components/apple-glass.css">
    <link rel="stylesheet" href="components/glass-components.css">
    <link rel="stylesheet" href="components/tpl-base.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="components/glass-components.js"></script>
    <script src="components/camera.js"></script>
    <script src="inputs/face-track.js"></script>
    <script src="components/canvas.js"></script>
    <script src="components/tpl-runtime.js"></script>
    <script src="components/tpl-parts.js"></script>
    <style>
      #st { position: absolute; display: flex; align-items: center; gap: calc(12px*var(--s)); padding: calc(14px*var(--s)) calc(30px*var(--s)); border-radius: 100px;
            font-weight: 800; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; opacity: 0; will-change: transform, opacity;
            border: calc(5px*var(--s)) solid #fff; box-shadow: 0 14px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.12); }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="sticker" data-width="1920" data-height="1080" data-start="0" data-duration="600">
      <div id="st"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var T = __hfTpl, P = __hfParts, E = __hfGlass.ease, esc = P.esc;
var V = T.vars({at:0,dur:3,x:960,y:400,text:"New",icon:"sparkle",rotate:-6,scale:1,color:"#ffd60a",ink:"#1c1c20"}, window.__hyperframes);
        var st = document.getElementById("st"), s = +V.scale || 1;
        st.style.setProperty("--s", s); st.style.background = V.color; st.style.color = V.ink; st.style.fontSize = Math.round(40*s) + "px";
        st.innerHTML = (V.icon ? P.icon(V.icon, Math.round(40*s)) : "") + '<span>' + esc(V.text) + '</span>';
        P.ensureSymbols();
        // centred on (x, y): measure after the content exists
        st.style.left = (V.x - st.offsetWidth/2) + "px"; st.style.top = (V.y - st.offsetHeight/2) + "px";
        var D = V.dur, rot = +V.rotate || 0, tl = gsap.timeline({paused:true}); window.__timelines["sticker"] = tl;
        tl.fromTo(st, {opacity:0, scale:0.2, rotation:rot - 18}, {opacity:1, scale:1, rotation:rot, duration:0.65, ease:E.bouncy}, 0);
        // a small wobble once it has landed (only when the hold is long enough)
        if (D >= 2.2) { tl.fromTo(st, {rotation:rot}, {rotation:rot + 4, duration:0.18, ease:"sine.out", immediateRender:false}, 1.1); tl.fromTo(st, {rotation:rot + 4}, {rotation:rot, duration:0.5, ease:E.bouncy, immediateRender:false}, 1.28); }
        tl.fromTo(st, {opacity:1, scale:1}, {opacity:0, scale:0.9, duration:0.3, ease:"power2.in", immediateRender:false}, D - 0.3);
      })();
    </script>
  </body>
</html>
